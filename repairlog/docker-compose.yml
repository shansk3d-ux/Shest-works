services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: repairlog
      POSTGRES_USER: repairlog
      POSTGRES_PASSWORD: repairlog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairlog"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"
      SECRET_KEY: dev-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: psql://repairlog:repairlog@db:5432/repairlog
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
