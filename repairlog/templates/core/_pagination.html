{% if is_paginated %}
<nav aria-label="Страницы" class="mt-3">
    <ul class="pagination">
        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link" href="?{{ querystring }}{% if querystring %}&{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>
        </li>
        {% else %}
        <li class="page-item disabled"><span class="page-link">Назад</span></li>
        {% endif %}
        <li class="page-item disabled">
            <span class="page-link">{{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
        </li>
        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link" href="?{{ querystring }}{% if querystring %}&{% endif %}page={{ page_obj.next_page_number }}">Вперёд</a>
        </li>
        {% else %}
        <li class="page-item disabled"><span class="page-link">Вперёд</span></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
